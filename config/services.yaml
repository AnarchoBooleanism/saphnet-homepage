- Services:
    - Home Assistant:
        icon: /icons/homeassistant.svg
        href: https://ha.int.saphnet.xyz
        description: Smart home manager
        widget:
            type: homeassistant
            url: https://ha.int.saphnet.xyz
            key: {{HOMEPAGE_VAR_HA_API_KEY}}
    - Komodo:
        icon: /icons/komodo-512x512.png
        href: https://komodo.int.saphnet.xyz
        description: System for deploying Docker containers
        server: control-server
        container: komodo-core
        widget: 
            type: komodo
            url: https://komodo.int.saphnet.xyz
            key: {{HOMEPAGE_VAR_KOMODO_API_KEY}}
            secret: {{HOMEPAGE_VAR_KOMODO_SECRET}}
            showSummary: true # optional, default: false. Takes precedence over showStacks
            showStacks: false # optional, default: false
    - The Void SMP (Remote):
        icon: minecraft.svg
        description: Minecraft SMP server (smp.thevoidpact.xyz)
        widget:
            type: minecraft
            url: udp://smp.thevoidpact.xyz:25565
    - Folding at Home:
        icon: foldingathome.svg
        href: https://fah.int.saphnet.xyz #add your address here
        description: Fighting disease through computing
        server: docker-host-pve3
        container: foldingathome
        showStats: true
        widget:
            type: customapi
            url: https://api.foldingathome.org/user/{{HOMEPAGE_VAR_FAH_USERNAME}} #add your user name here
            refreshInterval: 43200000 #set for every 12 hours, for daily scores to not overuse their api
            method: GET
            mappings:
              - field: name
                label: Name
                format: text
              - field: wus
                label: work units
                format: number
              - field: rank
                label: Rank
                format: number
              - field: score
                label: score
                format: number
    - netboot.xyz:
        icon: /icons/netbootxyz.svg
        href: https://netboot.int.saphnet.xyz
        description: PXE server for loading OSes
        server: docker-host-pve1
        container: netbootxyz
        showStats: true

- Media Server:
    - Jellyfin:
        icon: jellyfin.svg
        href: https://jellyfin.int.saphnet.xyz
        description: Server for managing and streaming media
        server: docker-host-pve3
        container: jellyfin
        showStats: true
        widget:
            type: jellyfin
            url: https://jellyfin.int.saphnet.xyz
            key: {{HOMEPAGE_VAR_JELLYFIN_API_KEY}}
            enableBlocks: true # optional, defaults to false
            enableNowPlaying: true # optional, defaults to true
            enableUser: true # optional, defaults to false
            showEpisodeNumber: true # optional, defaults to false
            expandOneStreamToTwoRows: false # optional, defaults to true
    - Radarr:
        icon: radarr.svg
        href: https://radarr.int.saphnet.xyz
        description: Movie collection manager through BitTorrent
        server: docker-host-pve3
        container: radarr
        showStats: true
        widget:
            type: radarr
            url: https://radarr.int.saphnet.xyz
            key: {{HOMEPAGE_VAR_RADARR_API_KEY}}
            enableQueue: true # optional, defaults to false
    - Jackett:
        icon: jackett.svg
        href: https://jackett.int.saphnet.xyz
        description: Proxy server for torrent trackers
        server: docker-host-pve3
        container: jackett
        showStats: true
        widget:
            type: jackett
            url: https://jackett.int.saphnet.xyz
            password: {{HOMEPAGE_VAR_JACKETT_PASSWORD}}

- Seedbox:
    - Deluge:
        icon: deluge.svg
        href: https://seedbox.int.saphnet.xyz
        description: Torrent client
        server: docker-host-pve3
        container: deluge
        showStats: true
        widget: # No need for Docker stats here
            type: deluge
            url: https://seedbox.int.saphnet.xyz
            password: {{HOMEPAGE_VAR_DELUGE_PASSWORD}}
            enableLeechProgress: true
    - Deluge SFTP:
        icon: /icons/filezilla.svg
        href: sftp://seedbox@seedbox.int-net.saphnet.xyz:2222
        description: Access downloaded seedbox files
        server: docker-host-pve3
        container: deluge-sftp
        showStats: true

- Utilities:
    - Nginx Proxy Manager:
        icon: /icons/nginxproxymanager.svg
        href: https://nginx.int.saphnet.xyz
        description: Manage reverse proxies and more
        server: docker-nginx
        container: nginx-proxy-manager-app-1
        showStats: true
        widget:
            type: npm
            url: https://nginx.int.saphnet.xyz
            username: {{HOMEPAGE_VAR_NPM_INT_USERNAME}}
            password: {{HOMEPAGE_VAR_NPM_INT_PASSWORD}}
    - Filestash:
        icon: /icons/filestash.svg
        href: https://filestash.int.saphnet.xyz
        description: Access file servers via web UI
        server: docker-nginx
        container: filestash
        showStats: true
    - Guacamole:
        icon: guacamole.svg
        href: https://guacamole.int.saphnet.xyz
        description: Remotely connect to systems via web UI
        server: docker-nginx
        container: guacamole
        showStats: true