- Server:
    - Proxmox (pve1):
        icon: proxmox.svg
        href: https://pve1.int.saphnet.xyz
        description: Primary hypervisor, on laptop
        widget:
            type: proxmox
            url: https://pve1.int.saphnet.xyz
            username: {{HOMEPAGE_VAR_PROXMOX_USERNAME}}
            password: {{HOMEPAGE_VAR_PROXMOX_PASSWORD}}
            node: pve1
    - TrueNAS Scale (nas1):
        icon: truenas.svg
        href: https://nas1.int.saphnet.xyz
        description: NAS host for bulk storage
        widget:
            type: truenas
            url: https://nas1.int.saphnet.xyz
            key: {{HOMEPAGE_VAR_TRUENAS_API_KEY}}
            enablePools: true
            nasType: scale
    - Proxmox Backup Server (on nas1):
        icon: proxmox.svg
        href: https://pbs.nas1.int.saphnet.xyz
        description: Backup manager for Proxmox
        widget:
            type: proxmoxbackupserver
            url: https://pbs.nas1.int.saphnet.xyz
            username: {{HOMEPAGE_VAR_PBS_USERNAME}}
            password: {{HOMEPAGE_VAR_PBS_PASSWORD}}
            datastore: TrueNAS
    - Proxmox (pve3):
        icon: proxmox.svg
        href: https://pve3.int.saphnet.xyz
        description: Hypervisor, on desktop
        widget:
            type: proxmox
            url: https://pve3.int.saphnet.xyz
            username: {{HOMEPAGE_VAR_PROXMOX_USERNAME}}
            password: {{HOMEPAGE_VAR_PROXMOX_PASSWORD}}
            node: pve3
    - Proxmox (pve4):
