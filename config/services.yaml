- Media Server:
    - Jellyfin:
        icon: jellyfin.svg
        href: https://jellyfin.media.int.saphnet.xyz
        description: Server for managing and streaming media
        server: docker-host-pve3
        container: jellyfin
        showStats: true
        widget:
            type: jellyfin
            url: https://jellyfin.media.int.saphnet.xyz
            key: {{HOMEPAGE_VAR_JELLYFIN_API_KEY}}
            enableBlocks: true # optional, defaults to false
            enableNowPlaying: true # optional, defaults to true
            enableUser: true # optional, defaults to false
            showEpisodeNumber: true # optional, defaults to false
            expandOneStreamToTwoRows: false # optional, defaults to true
    - Jellyseerr:
        icon: jellyseerr.svg
