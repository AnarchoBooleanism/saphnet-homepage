name: Checks, for new commits

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - main
    paths-ignore:
      - '**/README.md' # Ignore documentation files
  push:
    branches:
      - main
    paths-ignore:
      - '**/README.md' # Ignore documentation files

jobs:
  changes:
    name: Detect changed files
    runs-on: ubuntu-26.04-arm
    outputs:
      compose: ${{ steps.changes.outputs.compose }}
      image: ${{ steps.changes.outputs.image }}
      renovate: ${{ steps.changes.outputs.renovate }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Detect changed files
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: changes
        with:
          filters: |
            compose:
              - '**/compose.yaml'
              - '**/compose.*.yaml'
            image:
              - 'api-server/**'
              - 'homepage/**'
              - 's6-overlay/**'
              - '.dockerignore'
              - 'Dockerfile'
            renovate:
              - ".github/renovate.jsonc"

  # Lints, other quick checks
  validate-config:
    name: Validate Renovate config
    needs: changes
    if: ${{ needs.changes.outputs.renovate == 'true' }}
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate Renovate config files
        uses: suzuki-shunsuke/github-action-renovate-config-validator@1e1604219a6b38ae9a10aff42a28a3656322c31a # v2.4.1
  
  compose-lint:
    name: Docker Compose lint
    needs: changes
    if: ${{ needs.changes.outputs.compose == 'true' }}
    runs-on: ubuntu-26.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run docker-compose-linter
        uses: docker-compose-linter/dclint-github-action@18659f6a7956706cb67cf9c1ad5e55f4352cbc17 # v1.6.0
        with:
          recursive: true
          exclude: .github
          # Rules being ignored for this repository, 
          # we have specific needs
          disable-rule: >-
            no-unbound-port-interfaces
            require-project-name-field
            service-image-require-explicit-tag
            services-alphabetical-order

  # Tests
  build-runner-image:
    name: Build image (for runners)
    needs: changes
    if: ${{ needs.changes.outputs.image == 'true' }}
    uses: AnarchoBooleanism/gha-workflows/.github/workflows/docker-build-runner-image.yaml@9f45abe6f02b121e207e4ed531e92dd029fb91f2 # docker-build-runner-image/v0.1.0

  smoke-check:
    name: Smoke check image
    needs: build-runner-image
    uses: AnarchoBooleanism/gha-workflows/.github/workflows/docker-smoke-check.yaml@9f45abe6f02b121e207e4ed531e92dd029fb91f2 # docker-build-runner-image/v0.1.0
