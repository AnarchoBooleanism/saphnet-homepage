# Thanks to https://medium.com/neudesic-innovation/building-multi-platform-container-images-with-github-actions-e495f9441ad3

name: Create and push image to GitHub registry

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'api-server/**'
      - 'homepage/**'
      - 's6-overlay/**'
      - '.dockerignore'
      - 'Dockerfile'

env:
  REGISTRY: &registry ghcr.io
  REGISTRY_USERNAME: &registry_username ${{ github.actor }}
  IMAGE_NAME: &image_name ${{ github.repository }}

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

concurrency:
  group: "docker-registry"
  cancel-in-progress: false

jobs:
  build:
    name: Build Docker image
    uses: AnarchoBooleanism/gha-workflows/.github/workflows/docker-multiarch-build.yaml@docker-multiarch/v0.1.0
    with:
      registry: *registry
      username: *registry_username
      image-name: *image_name
      docker-build-context: .
      dockerfile-path: ./Dockerfile
    secrets:
      password: ${{ secrets.GITHUB_TOKEN }}
  merge:
    name: Merge image manifests
    needs: build
    uses: AnarchoBooleanism/gha-workflows/.github/workflows/docker-multiarch-merge-push.yaml@docker-multiarch/v0.1.0
    with:
      registry: *registry
      username: ${{ github.actor }}
      image-name: *image_name
      is-prerelease: false
      versioning-type: edge
    secrets:
      password: ${{ secrets.GITHUB_TOKEN }}
